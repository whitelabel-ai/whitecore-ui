thresholds:
  max_function_lines: 100
  max_parameters: 12
  min_duplicate_string_length: 30
  min_duplicate_string_occurrences: 6

ignore:
  - node_modules/**
  - .git/**
  - dist/**
  - build/**
  - coverage/**
  - .whitecore/**
  - .next/**
  - local.db*
  - playwright.config.*
  - '**/*.test.*'
  - '**/*.spec.*'

languages:
  extensions:
    - .js
    - .ts
    - .jsx
    - .tsx
    - .py
    - .go
    - .java
    - .cs
