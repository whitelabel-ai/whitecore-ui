# Context Dependency Map (CDM)
# https://whitecore-os.netlify.app/
#
# Este archivo mapea documentos de contexto a los archivos de código que los invalidan.
# Si un archivo bajo 'triggers_on' cambia en un PR y el documento correspondiente
# NO fue modificado en ese mismo PR, la CI fallará.
#
# Adaptado para Plataforma de Diagnóstico Empresarial — Next.js App Router.

docs/rules.md:
  triggers_on:
    - src/modules/auth/**
    - src/modules/company/**
    - src/modules/user/**
    - src/modules/diagnostic/**
    - src/app/api/**
    - src/lib/db/**
    - src/lib/auth.ts
  owner: dev-lead
  review_instruction: >
    Revisar si los cambios introducen nueva lógica condicional,
    reglas de negocio, o modifican permisos/seguridad/roles.

docs/context.md:
  triggers_on:
    - package.json
    - package-lock.json
    - next.config.ts
    - vitest.config.ts
    - playwright.config.ts
    - postcss.config.mjs
    - tailwind.config.*
    - src/lib/**/*.config.*
    - src/middleware.ts
  owner: dev-lead
  review_instruction: >
    Revisar si los cambios alteran el stack tecnológico,
    dependencias principales, o configuración de infraestructura.

docs/project.md:
  triggers_on:
    - src/**
    - docs/**
  owner: product-owner
  review_instruction: >
    Revisar si los cambios afectan el alcance de features en curso,
    slices planificados, o requieren actualización del roadmap.

# Reglas base vinculadas:
docs/global/rules-base.md:
  triggers_on:
    - src/**
    - .whitecore/arch-check.js
  owner: architect
  review_instruction: >
    Si la estructura de código cambia significativamente,
    evaluar si los estándares SOLID/DRY siguen siendo aplicables.

# BRAIN vinculado:
BRAIN.md:
  triggers_on:
    - docs/rules.md
  owner: architect
  review_instruction: >
    Si las reglas de negocio cambian, evaluar si el patrón
    merece subir al estándar global (BRAIN.md).

# NOTES.md por módulo:
src/modules/auth/NOTES.md:
  triggers_on:
    - src/modules/auth/**
  owner: dev-lead
  review_instruction: Revisar decisiones tácticas y deuda técnica del módulo auth.

src/modules/company/NOTES.md:
  triggers_on:
    - src/modules/company/**
  owner: dev-lead
  review_instruction: Revisar decisiones tácticas y deuda técnica del módulo company.

src/modules/user/NOTES.md:
  triggers_on:
    - src/modules/user/**
  owner: dev-lead
  review_instruction: Revisar decisiones tácticas y deuda técnica del módulo user.

src/modules/diagnostic/NOTES.md:
  triggers_on:
    - src/modules/diagnostic/**
  owner: dev-lead
  review_instruction: Revisar decisiones tácticas y deuda técnica del módulo diagnostic.
