thresholds:
  max_function_lines: 100
  max_parameters: 12
  min_duplicate_string_length: 50
  min_duplicate_string_occurrences: 5

ignore:
  - node_modules/**
  - .git/**
  - dist/**
  - build/**
  - .next/**
  - coverage/**
  - .whitecore/**
  - '**/*.test.*'
  - '**/*.spec.*'
  - playwright.config.ts

languages:
  extensions:
    - .js
    - .ts
    - .jsx
    - .tsx
    - .py
    - .go
    - .java
    - .cs
